<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Universe · Scout · playhunter.dev</title>
    <meta name="description" content="The full breakout-candidate universe as an image-led tile grid. Filter, sort, drill in." />
    <link rel="preconnect" href="https://shared.akamai.steamstatic.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" class="brief">
      <header class="masthead">
        <div class="masthead-l">
          <a class="brand" href="./index.html">SCOUT</a>
          <div class="tagline">the desk for breakout games</div>
        </div>
        <div class="masthead-r">
          <a class="back" href="./index.html">← Brief</a>
        </div>
      </header>

      <section class="page-head">
        <h1 class="page-title">Universe</h1>
        <p class="page-deck">Every tracked candidate as a card. Sorted by score by default. Click any tile to drill in.</p>
      </section>

      <section class="uni-controls">
        <div class="filter-group">
          <span class="filter-label">Stage</span>
          <button class="filter-chip active" data-filter="stage" data-value="">All</button>
          <button class="filter-chip" data-filter="stage" data-value="Announced">Announced</button>
          <button class="filter-chip" data-filter="stage" data-value="Early Access">EA</button>
          <button class="filter-chip" data-filter="stage" data-value="Launched">Launched</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">Scale</span>
          <button class="filter-chip active" data-filter="scale" data-value="">All</button>
          <button class="filter-chip" data-filter="scale" data-value="Phenom">Phenom</button>
          <button class="filter-chip" data-filter="scale" data-value="Hit">Hit</button>
          <button class="filter-chip" data-filter="scale" data-value="Cult">Cult</button>
          <button class="filter-chip" data-filter="scale" data-value="Watch">Watch</button>
          <button class="filter-chip" data-filter="scale" data-value="Settled">Settled</button>
        </div>
        <div class="filter-group">
          <span class="filter-label">Sort</span>
          <button class="filter-chip active" data-filter="sort" data-value="score">Score</button>
          <button class="filter-chip" data-filter="sort" data-value="delta">Delta</button>
          <button class="filter-chip" data-filter="sort" data-value="wishlists">Wishlists</button>
          <button class="filter-chip" data-filter="sort" data-value="hypes">Hypes</button>
          <button class="filter-chip" data-filter="sort" data-value="revenue">Revenue</button>
        </div>
        <span class="uni-count" id="uni-count">—</span>
      </section>

      <section id="uni-grid" class="uni-grid"></section>

      <footer class="footnav">
        <a class="footlink" href="./index.html">Brief</a>
        <a class="footlink" href="./watchlist.html">Watchlist</a>
        <a class="footlink active" href="./universe.html">Universe</a>
        <a class="footlink" href="./explore.html">Explore</a>
        <a class="footlink" href="./meta.html">Meta</a>
        <a class="footlink" href="./upstream.html">Upstream</a>
        <a class="footlink" href="./comparables.html">Comparables</a>
        <a class="footlink" href="./methodology.html">Methodology</a>
      </footer>
    </main>
    <script src="./universe.js"></script>
  </body>
</html>
