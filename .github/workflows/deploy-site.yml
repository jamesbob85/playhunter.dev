name: Deploy site

# playhunter.dev is now the gamespec dashboard, served at the root.
# Editorial (Astro) site was retired 2026-08-08 — source remains in site/
# but is no longer built or deployed. Legacy surfaces preserved:
#   /scout            — Scout daily brief (refreshed by scout-daily.yml)
#   /dashboard.html   — alias for the dashboard (old links)
#   /privacy, /{lang}/privacy — privacy policy (Google Play listing requirement)
# Runs on every push to main — including scout-bot's daily data commits.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p dist
          cp index.html dashboard.html games.json CNAME dist/
          cp -r assets dist/assets
          cp -r scout dist/scout
          cp -r legal/. dist/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
